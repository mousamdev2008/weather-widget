<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather Widget – Assignment 14</title>
  <style>
    /* Colours: a daytime-sky palette, with a dark version for dark mode */
    :root {
      color-scheme: light;
      --bg: #dcecf7;      /* pale sky */
      --card: #ffffff;
      --ink: #12324a;     /* deep blue-grey text */
      --muted: #557086;
      --accent: #1f6fb2;  /* button blue */
      --error: #b3261e;
    }
    @media (prefers-color-scheme: dark) {
      :root { color-scheme: dark; --bg:#0e1d2a; --card:#162a3b; --ink:#e3eef7; --muted:#9db4c7; --accent:#5aa6e6; --error:#ff8a80; }
    }
    body { margin:0; min-height:100vh; display:grid; place-items:center;
           background:var(--bg); color:var(--ink);
           font-family: "Segoe UI", system-ui, sans-serif; }
    .widget { width:min(360px, 92vw); background:var(--card); border-radius:20px; padding:24px;
              box-shadow:0 10px 30px rgba(18,50,74,.15); }
    h1 { font-size:1.1rem; margin:0 0 16px; font-weight:600; }
    form { display:flex; gap:8px; }
    input { flex:1; padding:10px 12px; border-radius:10px; border:1px solid var(--muted);
            font-size:1rem; background:transparent; color:var(--ink); }
    button { padding:10px 16px; border:0; border-radius:10px; background:var(--accent);
             color:#fff; font-size:1rem; cursor:pointer; }
    button:focus-visible, input:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
    .temp { font-size:3.5rem; font-weight:300; margin:16px 0 0; }
    .city { font-size:1.25rem; margin:0; }
    .desc { color:var(--muted); text-transform:capitalize; margin:4px 0 12px; }
    .details { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; font-size:.9rem; }
    .details span { display:block; color:var(--muted); font-size:.8rem; }
    .message { margin-top:16px; color:var(--muted); }
    .message.error { color:var(--error); }
    [hidden] { display:none; }
  </style>
</head>
<body>
  <main class="widget">
    <h1>Check the weather</h1>

    <!-- Search form: city name in, weather card out -->
    <form id="searchForm">
      <input id="cityInput" type="text" placeholder="e.g. Hyderabad" aria-label="City name" required>
      <button type="submit">Search</button>
    </form>

    <!-- Result card: hidden until the first successful search -->
    <section id="result" hidden>
      <p class="temp"><span id="temp"></span>°C</p>
      <p class="city" id="city"></p>
      <p class="desc" id="desc"></p>
      <div class="details">
        <div><span>Feels like</span><b id="feels"></b></div>
        <div><span>Humidity</span><b id="humidity"></b></div>
        <div><span>Wind</span><b id="wind"></b></div>
      </div>
    </section>

    <p id="message" class="message">Enter a city to see its current weather.</p>
  </main>

  <!-- config.js holds the API key (kept out of Git). Load it before the main script. -->
  <script src="config.js"></script>
  <script>
    // ---- 1. Endpoint and friendly messages for each HTTP status code ----
    const ENDPOINT = "https://api.openweathermap.org/data/2.5/weather";
    const ERROR_TEXT = {
      401: "API key problem: check config.js, or wait for a new key to activate.",
      404: "City not found. Check the spelling and try again.",
      429: "Too many requests. Wait a minute and try again.",
      500: "The weather service has a problem. Try again later."
    };

    const $ = id => document.getElementById(id);   // tiny helper to grab elements

    // ---- 2. Show a status/error message under the form ----
    function showMessage(text, isError = false) {
      $("message").textContent = text;
      $("message").className = isError ? "message error" : "message";
    }

    // ---- 3. Call the API for one city ----
    async function getWeather(city) {
      // Fail early if the key was never added
      const cfg = window.WEATHER_CONFIG;
      if (!cfg || !cfg.apiKey || cfg.apiKey.startsWith("PASTE_")) {
        showMessage("No API key: copy config.example.js to config.js and add your key.", true);
        return;
      }
      // Build the URL safely: URLSearchParams encodes spaces etc.
      const params = new URLSearchParams({
        q: city,
        units: "metric",                       // Celsius
        appid: window.WEATHER_CONFIG.apiKey
      });

      showMessage("Loading…");
      try {
        const response = await fetch(`${ENDPOINT}?${params}`);
        console.log("Status code:", response.status);   // visible in console screenshot

        if (!response.ok) {                              // anything not 2xx
          const text = ERROR_TEXT[response.status] || `Request failed (code ${response.status}).`;
          $("result").hidden = true;
          showMessage(`${response.status}: ${text}`, true);
          return;
        }

        const data = await response.json();              // parse JSON body
        console.log("Weather data:", data);
        render(data);
      } catch (err) {
        // fetch itself throws only for network problems (offline, blocked)
        console.error("API error:", err);
        showMessage("Network error: check your internet connection.", true);
      }
    }

    // ---- 4. Put the response fields into the card ----
    function render(data) {
      $("temp").textContent = Math.round(data.main.temp);
      $("city").textContent = `${data.name}, ${data.sys.country}`;
      $("desc").textContent = data.weather[0].description;
      $("feels").textContent = `${Math.round(data.main.feels_like)}°C`;
      $("humidity").textContent = `${data.main.humidity}%`;
      $("wind").textContent = `${data.wind.speed} m/s`;
      $("result").hidden = false;
      showMessage("Updated just now.");
    }

    // ---- 5. Wire up the form ----
    $("searchForm").addEventListener("submit", event => {
      event.preventDefault();                            // stop page reload
      const city = $("cityInput").value.trim();
      if (city) getWeather(city);
    });
  </script>
</body>
</html>
